name: CI

# Cloudflare Pages deploys from its own Git integration; this workflow only
# checks. Running it on main too means a bad content edit shows up as a failed
# check here, next to the commit that caused it.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, build & performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Content schemas, the quality floor and TypeScript all fail here
      # rather than in production.
      - name: Typecheck
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Lighthouse budget
        run: npx --yes @lhci/cli@0.14.x autorun
