name: CI

# Cloudflare Pages deploys from its own Git integration; this workflow only
# checks. Running it on main too means a bad content edit shows up as a failed
# check here, next to the commit that caused it.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, build & performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Content schemas, the quality floor and TypeScript all fail here
      # rather than in production.
      - name: Typecheck
        run: npx astro check

      - name: Build
        run: npm run build

      # Lighthouse measures the templates, not the words in them. Saving an
      # article cannot change the performance budget, so skip it for
      # content-only pushes: it is the slowest step by far. Anything we cannot
      # classify runs it, so the budget is never skipped by accident.
      - name: Does this change any code?
        id: scope
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; running the full check."
            exit 0
          fi
          changed=$(git diff --name-only "$before" '${{ github.sha }}')
          echo "$changed"
          if echo "$changed" | grep -qvE '^src/content/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Content-only change; skipping the performance budget."
          fi

      - name: Lighthouse budget
        if: steps.scope.outputs.code == 'true'
        run: npx --yes @lhci/cli@0.14.x autorun
