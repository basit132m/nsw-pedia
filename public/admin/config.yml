# NSWPEDIA content admin.
#
# Every field here mirrors src/content.config.ts. If you add a field to the
# schema, add it here too, or the editor will not be able to fill it.
#
# The build still enforces the quality floor on anything saved from this
# panel: a game needs a cover, 3+ compatibility rows and 250+ words of body
# copy, or the deploy fails. That is intentional.

backend:
  name: github
  repo: basit132m/nsw-pedia
  branch: main
  # Replace with your deployed OAuth worker URL (see SETUP.md, "Admin panel").
  base_url: https://REPLACE-WITH-YOUR-AUTH-WORKER.workers.dev

site_url: https://nsw-pedia.com
display_url: https://nsw-pedia.com
logo_url: https://nsw-pedia.com/logo.webp

media_folder: public/uploads
public_folder: /uploads

collections:
  # ---------------------------------------------------------------- games
  - name: games
    label: Games
    label_singular: Game
    folder: src/content/games
    create: true
    slug: '{{slug}}'
    preview_path: 'games/{{slug}}'
    media_folder: images
    public_folder: ./images
    summary: '{{title}} — v{{version}} ({{fileType}})'
    sortable_fields: [title, releaseDate, updatedAt]
    fields:
      - { label: Game name, name: title, widget: string }
      - label: Also known as
        name: alternateTitles
        widget: list
        required: false
        hint: Japanese title, romaji, regional variants. Strong long-tail search value.
      - { label: Summary, name: summary, widget: text, pattern: ['^.{50,300}$', 'Must be between 50 and 300 characters'], hint: 'One or two sentences. Used as the meta description. 50–300 characters.' }
      - { label: Cover art, name: cover, widget: image, hint: 'Portrait box art, ideally 800×1200 or larger.' }
      - { label: Banner, name: banner, widget: image, required: false }
      - label: Screenshots
        name: screenshots
        widget: list
        required: false
        fields:
          - { label: Image, name: src, widget: image }
          - { label: Alt text, name: alt, widget: string, hint: 'Describe what is happening in the shot.' }
      - { label: YouTube trailer ID, name: trailerId, widget: string, required: false }

      - { label: Genres, name: genres, widget: list, hint: 'At least one, e.g. Platformer, Action-adventure.' }
      - { label: Developer, name: developer, widget: string }
      - { label: Published by, name: publisher, widget: relation, collection: publishers, search_fields: [title], value_field: '{{slug}}', display_fields: [title], hint: 'Pick from the Publishers collection. Add the publisher there first if missing.' }
      - { label: Series, name: series, widget: string, required: false, hint: 'e.g. Super Mario. Drives related-game linking.' }
      - { label: Release date, name: releaseDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }

      - { label: Title ID, name: titleId, widget: string, pattern: ['^[0-9A-F]{16}$', 'Must be exactly 16 uppercase hex characters, e.g. 0100000000010000'] }
      - { label: Build ID, name: buildId, widget: string, required: false, hint: 'Changes with every update, unlike the Title ID.' }
      - { label: Version, name: version, widget: string, hint: 'e.g. 1.3.0' }
      - { label: Size, name: fileSize, widget: string, hint: 'e.g. 5.7 GB' }
      - { label: File type, name: fileType, widget: select, options: [NSP, XCI, NSZ, XCZ] }
      - { label: Trimmed, name: trimmed, widget: boolean, default: false, required: false }
      - { label: Required firmware, name: requiredFirmware, widget: string, hint: 'Minimum version, e.g. 3.0.1' }
      - { label: Region, name: region, widget: select, options: [USA, EUR, JPN, ASIA, World, Multi] }
      - { label: Content type, name: contentType, widget: select, options: ['Base game', 'Update', 'DLC'], default: 'Base game' }
      - { label: Includes update, name: includedUpdate, widget: string, required: false }
      - { label: DLC count, name: dlcCount, widget: number, value_type: int, default: 0, min: 0, required: false }
      - label: Checksums
        name: checksums
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: SHA-256, name: sha256, widget: string, required: false }
          - { label: CRC32, name: crc32, widget: string, required: false }

      - label: Languages
        name: languages
        widget: object
        fields:
          - { label: Audio, name: audio, widget: list, required: false }
          - { label: Subtitles, name: subtitles, widget: list, hint: 'At least one.' }

      - label: Players
        name: players
        widget: object
        fields:
          - { label: Offline players, name: offline, widget: number, value_type: int, default: 1, min: 1 }
          - { label: Local co-op players, name: localCoop, widget: number, value_type: int, default: 0, min: 0, required: false }
          - { label: Online players, name: online, widget: number, value_type: int, default: 0, min: 0, required: false }
          - { label: Nintendo Switch Online required, name: nsoRequired, widget: boolean, default: false, required: false }
      - { label: Play modes, name: playModes, widget: select, multiple: true, options: [TV, Tabletop, Handheld] }
      - { label: Features, name: features, widget: list, required: false, hint: 'e.g. HD Rumble, amiibo support, Motion controls.' }
      - label: Age ratings
        name: ageRatings
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: ESRB, name: esrb, widget: string, required: false }
          - { label: PEGI, name: pegi, widget: string, required: false }
          - { label: CERO, name: cero, widget: string, required: false }

      - label: Emulator compatibility
        name: emulatorCompat
        widget: list
        min: 3
        label_singular: Compatibility result
        summary: '{{fields.emulator}} / {{fields.platform}} — {{fields.status}} ({{fields.source}})'
        hint: 'At least three rows. Mark each as Tested (you ran it, name the tester) or Reported (from a community source, give the link).'
        fields:
          - { label: Emulator, name: emulator, widget: relation, collection: emulators, search_fields: [title], value_field: '{{slug}}', display_fields: [title] }
          - { label: Platform, name: platform, widget: select, options: [Windows, Linux, macOS, Android, 'Steam Deck', 'ROG Ally'] }
          - { label: Device tested, name: device, widget: string, hint: 'Be specific, e.g. "Ryzen 7 7800X3D / RTX 4070".' }
          - { label: FPS, name: fps, widget: string, hint: 'e.g. 60, or 45–60.' }
          - { label: Status, name: status, widget: select, options: [Perfect, Playable, Ingame, Menus, Boots, Nothing] }
          - { label: Notes, name: notes, widget: string, required: false }
          - { label: Source, name: source, widget: select, options: [tested, reported], default: reported }
          - { label: Source URL, name: sourceUrl, widget: string, required: false, hint: 'Required when Source is "reported".' }
          - { label: Date, name: testedOn, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
          - { label: Tested by, name: testedBy, widget: relation, collection: authors, search_fields: [name], value_field: '{{slug}}', display_fields: [name], required: false, hint: 'Required when Source is "tested".' }

      - label: Hardware tiers
        name: deviceTiers
        widget: list
        required: false
        summary: '{{fields.tier}} — {{fields.result}}'
        fields:
          - { label: Tier, name: tier, widget: string, hint: 'e.g. High end, Handheld PC, Android flagship.' }
          - { label: Device, name: device, widget: string }
          - { label: Result, name: result, widget: string }
      - { label: Known issues, name: knownIssues, widget: list, required: false }

      - label: Version history
        name: versionHistory
        widget: list
        required: false
        summary: '{{fields.version}} — {{fields.date}}'
        fields:
          - { label: Version, name: version, widget: string }
          - { label: Released, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
          - { label: Patch notes, name: notes, widget: text }
          - { label: Size, name: fileSize, widget: string, required: false }

      - label: FAQ
        name: faq
        widget: list
        required: false
        summary: '{{fields.question}}'
        hint: 'Each entry becomes FAQ structured data and is eligible for rich results.'
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }

      - { label: Related games, name: relatedGames, widget: relation, collection: games, search_fields: [title], value_field: '{{slug}}', display_fields: [title], multiple: true, required: false, hint: 'Optional. Related games are also generated automatically.' }
      - { label: Nintendo eShop URL, name: eshopUrl, widget: string, required: false }
      - { label: Wikidata ID, name: wikidataId, widget: string, required: false, hint: 'e.g. Q28400301. Helps Google connect this page to the known entity.' }
      - { label: IGDB ID, name: igdbId, widget: number, value_type: int, required: false }
      - label: Ratings
        name: rating
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Metacritic, name: metacritic, widget: number, value_type: int, required: false, min: 0, max: 100 }
          - { label: User score, name: userScore, widget: number, required: false }

      - { label: Author, name: author, widget: relation, collection: authors, search_fields: [name], value_field: '{{slug}}', display_fields: [name] }
      - { label: Published at, name: publishedAt, widget: datetime, picker_utc: true }
      - { label: Updated at, name: updatedAt, widget: datetime, picker_utc: true, hint: 'Bump this whenever you revise the page. It feeds dateModified.' }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: 'Drafts are excluded from the build and skip the quality floor.' }
      - { label: Body, name: body, widget: markdown, hint: 'Minimum 250 words of original writing, or the build will reject the page.' }

  # ------------------------------------------------------------ emulators
  - name: emulators
    label: Emulators
    label_singular: Emulator
    folder: src/content/emulators
    create: true
    slug: '{{slug}}'
    preview_path: 'emulators/{{slug}}'
    media_folder: images
    public_folder: ./images
    summary: '{{title}} — {{status}}'
    fields:
      - { label: Name, name: title, widget: string }
      - { label: Summary, name: summary, widget: text, pattern: ['^.{50,300}$', 'Must be between 50 and 300 characters'] }
      - { label: Logo, name: logo, widget: image }
      - { label: Platforms, name: platforms, widget: list, hint: 'e.g. Windows, Linux, Android.' }
      - { label: Latest version, name: latestVersion, widget: string, required: false }
      - { label: Licence, name: license, widget: string, required: false }
      - { label: Status, name: status, widget: select, options: [Active, 'Maintenance only', Discontinued, Fork] }
      - { label: Source repository, name: sourceUrl, widget: string, required: false }
      - { label: Official site, name: officialUrl, widget: string, required: false }
      - label: Requirements
        name: requirements
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: CPU, name: cpu, widget: string }
          - { label: GPU, name: gpu, widget: string }
          - { label: RAM, name: ram, widget: string }
      - { label: Strengths, name: pros, widget: list, required: false }
      - { label: Limitations, name: cons, widget: list, required: false }
      - label: FAQ
        name: faq
        widget: list
        required: false
        summary: '{{fields.question}}'
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - { label: Author, name: author, widget: relation, collection: authors, search_fields: [name], value_field: '{{slug}}', display_fields: [name] }
      - { label: Published at, name: publishedAt, widget: datetime, picker_utc: true }
      - { label: Updated at, name: updatedAt, widget: datetime, picker_utc: true }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown, hint: 'Minimum 250 words of original writing.' }

  # --------------------------------------------------------------- guides
  - name: guides
    label: Guides
    label_singular: Guide
    folder: src/content/guides
    create: true
    slug: '{{slug}}'
    preview_path: 'guides/{{slug}}'
    media_folder: images
    public_folder: ./images
    summary: '{{title}}'
    sortable_fields: [title, updatedAt]
    fields:
      - { label: Title, name: title, widget: string, hint: 'Write it as the search query someone would type.' }
      - { label: Summary, name: summary, widget: text, pattern: ['^.{50,300}$', 'Must be between 50 and 300 characters'] }
      - { label: Cover, name: cover, widget: image, required: false }
      - { label: Difficulty, name: difficulty, widget: select, options: [Beginner, Intermediate, Advanced], default: Beginner }
      - { label: Time required, name: timeRequired, widget: string, required: false, hint: 'e.g. 6 min read.' }
      - { label: Tags, name: tags, widget: list, required: false }
      - label: FAQ
        name: faq
        widget: list
        required: false
        summary: '{{fields.question}}'
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - { label: Author, name: author, widget: relation, collection: authors, search_fields: [name], value_field: '{{slug}}', display_fields: [name] }
      - { label: Published at, name: publishedAt, widget: datetime, picker_utc: true }
      - { label: Updated at, name: updatedAt, widget: datetime, picker_utc: true }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown, hint: 'Minimum 250 words of original writing.' }

  # ------------------------------------------------------------- homebrew
  - name: homebrew
    label: Homebrew
    label_singular: Homebrew item
    folder: src/content/homebrew
    create: true
    slug: '{{slug}}'
    preview_path: 'homebrew/{{slug}}'
    media_folder: images
    public_folder: ./images
    summary: '{{title}} — {{license}}'
    fields:
      - { label: Name, name: title, widget: string }
      - { label: Summary, name: summary, widget: text, pattern: ['^.{50,300}$', 'Must be between 50 and 300 characters'] }
      - { label: Icon / cover, name: cover, widget: image }
      - { label: Created by, name: author_name, widget: string, hint: 'The project or person who made it.' }
      - { label: Licence, name: license, widget: string, hint: 'Must permit redistribution. If it does not, it does not belong here.' }
      - { label: Source repository, name: sourceUrl, widget: string }
      - { label: Download URL, name: downloadUrl, widget: string, hint: "Link to the project's own releases page, never a mirror." }
      - { label: File type, name: fileType, widget: select, options: [NRO, NSP, ZIP] }
      - { label: Size, name: fileSize, widget: string }
      - { label: Version, name: version, widget: string }
      - { label: Required firmware, name: requiredFirmware, widget: string, required: false }
      - { label: Category, name: genres, widget: list, required: false }
      - label: FAQ
        name: faq
        widget: list
        required: false
        summary: '{{fields.question}}'
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - { label: Author, name: author, widget: relation, collection: authors, search_fields: [name], value_field: '{{slug}}', display_fields: [name] }
      - { label: Published at, name: publishedAt, widget: datetime, picker_utc: true }
      - { label: Updated at, name: updatedAt, widget: datetime, picker_utc: true }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown }

  # ----------------------------------------------------------- publishers
  - name: publishers
    label: Publishers
    label_singular: Publisher
    folder: src/content/publishers
    create: true
    slug: '{{slug}}'
    preview_path: 'publishers/{{slug}}'
    media_folder: images
    public_folder: ./images
    summary: '{{title}}'
    fields:
      - { label: Name, name: title, widget: string }
      - { label: Summary, name: summary, widget: text, pattern: ['^.{30,300}$', 'Must be between 30 and 300 characters'] }
      - { label: Logo, name: logo, widget: image, required: false }
      - { label: Founded, name: founded, widget: string, required: false }
      - { label: Country, name: country, widget: string, required: false }
      - { label: Website, name: website, widget: string, required: false }
      - { label: Wikidata ID, name: wikidataId, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }

  # -------------------------------------------------------------- authors
  - name: authors
    label: Authors
    label_singular: Author
    folder: src/content/authors
    create: true
    slug: '{{slug}}'
    preview_path: 'authors/{{slug}}'
    media_folder: images
    public_folder: ./images
    summary: '{{name}} — {{role}}'
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Role, name: role, widget: string, hint: 'e.g. Editor, Compatibility Testing.' }
      - { label: Bio, name: bio, widget: text, pattern: ['^.{80,}$', 'At least 80 characters'], hint: 'Real experience matters here. Google weighs author credibility.' }
      - { label: Avatar, name: avatar, widget: image, required: false }
      - { label: Test hardware, name: testingRig, widget: list, required: false, hint: 'The machines this person tests on.' }
      - { label: Profile links, name: sameAs, widget: list, required: false, hint: 'Full URLs to public profiles.' }
      - { label: Body, name: body, widget: markdown }
