# NSWPEDIA content admin.
#
# Every field here mirrors src/content.config.ts.
#
# Only the title is required. Everything else can be left blank and filled in
# later: the page template omits any row or section that has no data, so a
# partly-filled page still renders cleanly and still publishes.
#
# The build warns about pages with under 250 words of original copy but no
# longer blocks them. Thin pages are a ranking risk, not a build error.

backend:
  name: github
  repo: basit132m/nsw-pedia
  branch: main
  base_url: https://nsw-pedia.com
site_url: https://nsw-pedia.com
display_url: https://nsw-pedia.com
logo_url: https://nsw-pedia.com/logo.webp
media_folder: public/uploads
public_folder: /uploads
collections:
- name: games
  label: Games
  label_singular: Game
  folder: src/content/games
  create: true
  slug: '{{slug}}'
  preview_path: games/{{slug}}
  media_folder: images
  public_folder: ./images
  summary: '{{title}} — v{{version}} ({{fileType}})'
  sortable_fields:
  - title
  - releaseDate
  - updatedAt
  fields:
  - label: Game name
    name: title
    widget: string
  - label: Also known as
    name: alternateTitles
    widget: list
    required: false
    hint: Japanese title, romaji, regional variants. Strong long-tail search value.
  - label: Summary
    name: summary
    widget: text
    hint: One or two sentences. Used as the meta description. 50–300 characters.
    required: false
  - label: Cover art
    name: cover
    widget: image
    hint: Portrait box art, ideally 800×1200 or larger.
    required: false
  - label: Banner
    name: banner
    widget: image
    required: false
  - label: Screenshots
    name: screenshots
    widget: list
    required: false
    fields:
    - label: Image
      name: src
      widget: image
      required: false
    - label: Alt text
      name: alt
      widget: string
      hint: Describe what is happening in the shot.
      required: false
  - label: YouTube trailer ID
    name: trailerId
    widget: string
    required: false
  - label: Genres
    name: genres
    widget: list
    hint: At least one, e.g. Platformer, Action-adventure.
    required: false
  - label: Developer
    name: developer
    widget: string
    required: false
  - label: Published by
    name: publisher
    widget: relation
    collection: publishers
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
    hint: Pick from the Publishers collection. Add the publisher there first if missing.
    required: false
  - label: Series
    name: series
    widget: string
    required: false
    hint: e.g. Super Mario. Drives related-game linking.
  - label: Release date
    name: releaseDate
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    picker_utc: true
    required: false
  - label: Title ID
    name: titleId
    widget: string
    pattern:
    - ^$|^[0-9A-F]{16}$
    - Leave blank, or use exactly 16 uppercase hex characters
    required: false
  - label: Build ID
    name: buildId
    widget: string
    required: false
    hint: Changes with every update, unlike the Title ID.
  - label: Version
    name: version
    widget: string
    hint: e.g. 1.3.0
    required: false
  - label: Size
    name: fileSize
    widget: string
    hint: e.g. 5.7 GB
    required: false
  - label: File type
    name: fileType
    widget: select
    options:
    - NSP
    - XCI
    - NSZ
    - XCZ
    required: false
  - label: Trimmed
    name: trimmed
    widget: boolean
    default: false
    required: false
  - label: Required firmware
    name: requiredFirmware
    widget: string
    hint: Minimum version, e.g. 3.0.1
    required: false
  - label: Region
    name: region
    widget: select
    options:
    - USA
    - EUR
    - JPN
    - ASIA
    - World
    - Multi
    required: false
  - label: Content type
    name: contentType
    widget: select
    options:
    - Base game
    - Update
    - DLC
    default: Base game
    required: false
  - label: Includes update
    name: includedUpdate
    widget: string
    required: false
  - label: DLC count
    name: dlcCount
    widget: number
    value_type: int
    default: 0
    required: false
  - label: Checksums
    name: checksums
    widget: object
    required: false
    collapsed: true
    fields:
    - label: SHA-256
      name: sha256
      widget: string
      required: false
    - label: CRC32
      name: crc32
      widget: string
      required: false
  - label: Languages
    name: languages
    widget: object
    fields:
    - label: Audio
      name: audio
      widget: list
      required: false
    - label: Subtitles
      name: subtitles
      widget: list
      hint: At least one.
      required: false
    required: false
  - label: Players
    name: players
    widget: object
    fields:
    - label: Offline players
      name: offline
      widget: number
      value_type: int
      default: 1
      required: false
    - label: Local co-op players
      name: localCoop
      widget: number
      value_type: int
      default: 0
      required: false
    - label: Online players
      name: online
      widget: number
      value_type: int
      default: 0
      required: false
    - label: Nintendo Switch Online required
      name: nsoRequired
      widget: boolean
      default: false
      required: false
    required: false
  - label: Play modes
    name: playModes
    widget: select
    multiple: true
    options:
    - TV
    - Tabletop
    - Handheld
    required: false
  - label: Features
    name: features
    widget: list
    required: false
    hint: e.g. HD Rumble, amiibo support, Motion controls.
  - label: Age ratings
    name: ageRatings
    widget: object
    required: false
    collapsed: true
    fields:
    - label: ESRB
      name: esrb
      widget: string
      required: false
    - label: PEGI
      name: pegi
      widget: string
      required: false
    - label: CERO
      name: cero
      widget: string
      required: false
  - label: Emulator compatibility
    name: emulatorCompat
    widget: list
    label_singular: Compatibility result
    summary: '{{fields.emulator}} / {{fields.platform}} — {{fields.status}} ({{fields.source}})'
    hint: At least three rows. Mark each as Tested (you ran it, name the tester) or Reported (from a community
      source, give the link).
    fields:
    - label: Emulator
      name: emulator
      widget: relation
      collection: emulators
      search_fields:
      - title
      value_field: '{{slug}}'
      display_fields:
      - title
      required: false
    - label: Platform
      name: platform
      widget: select
      options:
      - Windows
      - Linux
      - macOS
      - Android
      - Steam Deck
      - ROG Ally
      required: false
    - label: Device tested
      name: device
      widget: string
      hint: Be specific, e.g. "Ryzen 7 7800X3D / RTX 4070".
      required: false
    - label: FPS
      name: fps
      widget: string
      hint: e.g. 60, or 45–60.
      required: false
    - label: Status
      name: status
      widget: select
      options:
      - Perfect
      - Playable
      - Ingame
      - Menus
      - Boots
      - Nothing
      required: false
    - label: Notes
      name: notes
      widget: string
      required: false
    - label: Source
      name: source
      widget: select
      options:
      - tested
      - reported
      default: reported
      required: false
    - label: Source URL
      name: sourceUrl
      widget: string
      required: false
      hint: Required when Source is "reported".
    - label: Date
      name: testedOn
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      picker_utc: true
      required: false
    - label: Tested by
      name: testedBy
      widget: relation
      collection: authors
      search_fields:
      - name
      value_field: '{{slug}}'
      display_fields:
      - name
      required: false
      hint: Required when Source is "tested".
    required: false
  - label: Hardware tiers
    name: deviceTiers
    widget: list
    required: false
    summary: '{{fields.tier}} — {{fields.result}}'
    fields:
    - label: Tier
      name: tier
      widget: string
      hint: e.g. High end, Handheld PC, Android flagship.
      required: false
    - label: Device
      name: device
      widget: string
      required: false
    - label: Result
      name: result
      widget: string
      required: false
  - label: Known issues
    name: knownIssues
    widget: list
    required: false
  - label: Version history
    name: versionHistory
    widget: list
    required: false
    summary: '{{fields.version}} — {{fields.date}}'
    fields:
    - label: Version
      name: version
      widget: string
      required: false
    - label: Released
      name: date
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      picker_utc: true
      required: false
    - label: Patch notes
      name: notes
      widget: text
      required: false
    - label: Size
      name: fileSize
      widget: string
      required: false
  - label: FAQ
    name: faq
    widget: list
    required: false
    summary: '{{fields.question}}'
    hint: Each entry becomes FAQ structured data and is eligible for rich results.
    fields:
    - label: Question
      name: question
      widget: string
      required: false
    - label: Answer
      name: answer
      widget: text
      required: false
  - label: Related games
    name: relatedGames
    widget: relation
    collection: games
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
    multiple: true
    required: false
    hint: Optional. Related games are also generated automatically.
  - label: Nintendo eShop URL
    name: eshopUrl
    widget: string
    required: false
  - label: Wikidata ID
    name: wikidataId
    widget: string
    required: false
    hint: e.g. Q28400301. Helps Google connect this page to the known entity.
  - label: IGDB ID
    name: igdbId
    widget: number
    value_type: int
    required: false
  - label: Ratings
    name: rating
    widget: object
    required: false
    collapsed: true
    fields:
    - label: Metacritic
      name: metacritic
      widget: number
      value_type: int
      required: false
      max: 100
    - label: User score
      name: userScore
      widget: number
      required: false
  - &id001
    label: SEO (optional)
    name: seo
    widget: object
    required: false
    collapsed: true
    fields:
    - label: Meta title
      name: metaTitle
      widget: string
      required: false
      hint: Overrides the title shown in Google. Aim for 50-60 characters. Used exactly as typed, with
        no site name added. Leave blank to auto-generate.
    - label: Meta description
      name: metaDescription
      widget: text
      required: false
      hint: Overrides the snippet under the title in Google. Aim for 140-155 characters; beyond that it
        gets cut off. Leave blank to auto-generate a short one.
    - label: Meta keywords
      name: keywords
      widget: list
      required: false
      hint: Leave blank to generate automatically from the genres, titles and publisher. Note that Google
        ignores meta keywords entirely; only some smaller engines read them.
    - label: Hide this page from search engines
      name: noindex
      widget: boolean
      default: false
      required: false
      hint: Adds a noindex tag. Use for pages you want live but not in search results.
  - label: Author
    name: author
    widget: relation
    collection: authors
    search_fields:
    - name
    value_field: '{{slug}}'
    display_fields:
    - name
    required: false
  - label: Published at
    name: publishedAt
    widget: datetime
    picker_utc: true
    required: false
  - label: Updated at
    name: updatedAt
    widget: datetime
    picker_utc: true
    hint: Bump this whenever you revise the page. It feeds dateModified.
    required: false
  - label: Draft
    name: draft
    widget: boolean
    default: false
    required: false
    hint: Drafts are excluded from the build and skip the quality floor.
  - label: Body
    name: body
    widget: markdown
    hint: Minimum 250 words of original writing, or the build will reject the page.
    required: false
